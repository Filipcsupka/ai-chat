name: Update knowledge-base ConfigMap in infra repo

# Runs after build-push succeeds — pushes the latest knowledge-base markdown
# files into infra/gitops/apps/ai-chat/base/knowledge-base-cm.yaml so that
# ArgoCD picks them up and re-deploys the rag-api pod with fresh content.
#
# Requires secret: INFRA_REPO_PAT (classic PAT with repo write access to Filipcsupka/infra)

on:
  workflow_run:
    workflows: ["Build and push RAG API image"]
    types: [completed]
    branches: [main]

jobs:
  update-configmap:
    name: Sync knowledge base to infra repo
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout ai-chat repo
        uses: actions/checkout@v4
        with:
          path: ai-chat

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Filipcsupka/infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Generate knowledge-base ConfigMap
        run: |
          python3 - <<'EOF'
          import os
          import yaml
          from pathlib import Path

          kb_dir = Path("ai-chat/knowledge-base")
          files = sorted(kb_dir.glob("*.md"))

          data = {}
          for f in files:
              data[f.name] = f.read_text()

          cm = {
              "apiVersion": "v1",
              "kind": "ConfigMap",
              "metadata": {
                  "name": "knowledge-base",
                  "namespace": "ai-chat",
                  "annotations": {
                      "generated-by": "github-actions",
                      "source-repo": "Filipcsupka/ai-chat",
                  },
              },
              "data": data,
          }

          out_path = Path("infra/gitops/apps/ai-chat/base/knowledge-base-cm.yaml")
          with open(out_path, "w") as f:
              f.write("# Auto-generated by update-kb-cm.yml — do not edit manually\n")
              yaml.dump(cm, f, default_flow_style=False, allow_unicode=True, width=120)

          print(f"Written {len(data)} files to {out_path}")
          EOF

      - name: Commit and push to infra repo
        working-directory: infra
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/ai-chat/base/knowledge-base-cm.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(ai-chat): sync knowledge base from ai-chat@${{ github.event.workflow_run.head_sha }}"
          git push
