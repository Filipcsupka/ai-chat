name: Update knowledge-base ConfigMap and image tag in infra repo

# Runs after build-push succeeds.
# Directly checks out infra repo and commits two changes in one push:
#   1. knowledge-base ConfigMap (from knowledge-base/ markdown files)
#   2. image tag in overlays/prod/kustomization.yaml
#
# Requires secret: INFRA_REPO_PAT (classic PAT, repo scope, for Filipcsupka account)

on:
  workflow_run:
    workflows: ["Build and push RAG API image"]
    types: [completed]
    branches: [main]

jobs:
  update-infra:
    name: Sync KB + image tag to infra repo
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout ai-chat repo
        uses: actions/checkout@v4
        with:
          path: ai-chat

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Filipcsupka/infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Generate knowledge-base ConfigMap
        run: |
          python3 - <<'EOF'
          import yaml
          from pathlib import Path

          kb_dir = Path("ai-chat/knowledge-base")
          files = sorted(kb_dir.glob("*.md"))

          data = {}
          for f in files:
              data[f.name] = f.read_text()

          cm = {
              "apiVersion": "v1",
              "kind": "ConfigMap",
              "metadata": {
                  "name": "knowledge-base",
                  "namespace": "ai-chat",
                  "annotations": {
                      "generated-by": "github-actions",
                      "source-repo": "Filipcsupka/ai-chat",
                  },
              },
              "data": data,
          }

          out_path = Path("infra/gitops/apps/ai-chat/base/knowledge-base-cm.yaml")
          with open(out_path, "w") as f:
              f.write("# Auto-generated by update-kb-cm.yml — do not edit manually\n")
              yaml.dump(cm, f, default_flow_style=False, allow_unicode=True, width=120)

          print(f"Written {len(data)} files to {out_path}")
          EOF

      - name: Update image tag in prod overlay
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="sha-${SHA::7}"
          sed -i "s/newTag: .*/newTag: ${TAG}/" \
            infra/gitops/apps/ai-chat/overlays/prod/kustomization.yaml
          echo "Image tag → ${TAG}"

      - name: Commit and push to infra repo
        working-directory: infra
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          PAT: ${{ secrets.INFRA_REPO_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT}@github.com/Filipcsupka/infra.git"
          git add \
            gitops/apps/ai-chat/base/knowledge-base-cm.yaml \
            gitops/apps/ai-chat/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(ai-chat): sync KB + bump image to sha-${SHA::7}"
          git push
