name: Build and push RAG API image

on:
  push:
    branches: [main]
    paths:
      - "rag-api/**"
      - "knowledge-base/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/filipcsupka/ai-chat-rag-api

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: rag-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-gitops:
    name: Update image tag in infra repo
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger infra update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_REPO_PAT }}
          script: |
            const sha = context.sha.substring(0, 7);
            await github.rest.repos.createDispatchEvent({
              owner: 'Filipcsupka',
              repo: 'infra',
              event_type: 'update-ai-chat-image',
              client_payload: { tag: `sha-${sha}` }
            });
