name: Build, push and deploy

on:
  push:
    branches: [main]
    paths:
      - "rag-api/**"
      - "knowledge-base/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/filipcsupka/ai-chat-rag-api

jobs:
  build-deploy:
    name: Build → push → update infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ai-chat
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: rag-api
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Filipcsupka/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Generate knowledge-base ConfigMap
        run: |
          python3 - <<'EOF'
          import yaml
          from pathlib import Path

          kb_dir = Path("knowledge-base")
          data = {f.name: f.read_text() for f in sorted(kb_dir.glob("*.md"))}

          cm = {
              "apiVersion": "v1",
              "kind": "ConfigMap",
              "metadata": {
                  "name": "knowledge-base",
                  "namespace": "ai-chat",
                  "annotations": {"generated-by": "github-actions"},
              },
              "data": data,
          }

          out = Path("infra/gitops/apps/ai-chat/base/knowledge-base-cm.yaml")
          with open(out, "w") as f:
              f.write("# Auto-generated — do not edit manually\n")
              yaml.dump(cm, f, default_flow_style=False, allow_unicode=True, width=120)

          print(f"ConfigMap: {len(data)} files")
          EOF

      - name: Update image tag in prod overlay
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s/newTag: .*/newTag: ${TAG}/" \
            infra/gitops/apps/ai-chat/overlays/prod/kustomization.yaml
          echo "Image tag → ${TAG}"

      - name: Commit and push to infra
        working-directory: infra
        env:
          PAT: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT}@github.com/Filipcsupka/infra.git"
          git add \
            gitops/apps/ai-chat/base/knowledge-base-cm.yaml \
            gitops/apps/ai-chat/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(ai-chat): deploy sha-${GITHUB_SHA::7}"
          git push
